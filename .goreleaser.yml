version: 2
project_name: "go-bin-template"
builds:
  -
    id: "go-bin-template"
    binary: "go-bin-template"
    env:
      - "CGO_ENABLED=0"
    goos:
      - "linux"
      - "darwin"
      - "windows"
    goarch:
      - "386"
      - "arm"
      - "arm64"
      - "amd64"
    ldflags:
      - -s
      - -w
      - -X "github.com/Eun/go-bin-template/cmd/root.version={{.Version}}"
      - -X "github.com/Eun/go-bin-template/cmd/root.commit={{.Commit}}"
      - -X "github.com/Eun/go-bin-template/cmd/root.date={{.Date}}"
archives:
  - name_template: "go-bin-template_{{.Version}}_{{.Os}}_{{.Arch}}{{if .Arm}}v{{.Arm}}{{end}}"
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{.Tag}}-next"
changelog:
  disable: true
nfpms:
  -
    id: "go-bin-template"
    package_name: "go-bin-template"
    homepage: "https://github.com/Eun/go-bin-template"
    maintainer: "Tobias Salzmann <tobias@salzmann.berlin>"
    description: "A template for golang"
    license: "MIT"
    formats:
      - "deb"
      - "rpm"
    epoch: 1
dockers:
  -
    id: "go-bin-template-amd64"
    goos: "linux"
    goarch: "amd64"
    ids:
      - "go-bin-template"
    image_templates:
      - "ghcr.io/eun/go-bin-template:{{.Tag}}-amd64"
    skip_push: false
    dockerfile: ".github/Dockerfile"
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--build-arg=BINARY=go-bin-template"
      - "--platform=linux/amd64"
  -
    id: "go-bin-template-arm64"
    goos: "linux"
    goarch: "arm64"
    ids:
      - "go-bin-template"
    image_templates:
      - "ghcr.io/eun/go-bin-template:{{.Tag}}-arm64"
    skip_push: false
    dockerfile: ".github/Dockerfile"
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--build-arg=BINARY=go-bin-template"
      - "--platform=linux/arm64"
docker_manifests:
  -
    name_template: "ghcr.io/eun/go-bin-template:{{.Tag}}"
    image_templates:
      - "ghcr.io/eun/go-bin-template:{{.Tag}}-amd64"
      - "ghcr.io/eun/go-bin-template:{{.Tag}}-arm64"
  -
    name_template: "ghcr.io/eun/go-bin-template:{{.Major}}"
    image_templates:
      - "ghcr.io/eun/go-bin-template:{{.Tag}}-amd64"
      - "ghcr.io/eun/go-bin-template:{{.Tag}}-arm64"
  -
    name_template: "ghcr.io/eun/go-bin-template:{{.Major}}.{{.Minor}}"
    image_templates:
      - "ghcr.io/eun/go-bin-template:{{.Tag}}-amd64"
      - "ghcr.io/eun/go-bin-template:{{.Tag}}-arm64"
  -
    name_template: "ghcr.io/eun/go-bin-template:latest"
    image_templates:
      - "ghcr.io/eun/go-bin-template:{{.Tag}}-amd64"
      - "ghcr.io/eun/go-bin-template:{{.Tag}}-arm64"
